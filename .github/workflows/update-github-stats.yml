name: Update GitHub stats

# Refreshes the GitHub stats on the site every Monday.
# Needs the GH_STATS_TOKEN secret: a fine-grained token with access to all
# repositories and read-only Contents + Metadata.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch:       # "Run workflow" button for a manual refresh
    inputs:
      allow_decrease:
        description: "Allow counts to go down (only if you deleted repos)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the updated data.json / index.html
  pages: write      # ask GitHub Pages to rebuild after the commit

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Recount stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          ALLOW_DECREASE: ${{ inputs.allow_decrease || false }}
        run: node scripts/update-github-stats.mjs

      - name: Commit and push if anything changed
        id: commit
        run: |
          if git diff --quiet -- data.json index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "Update GitHub stats"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes by the built-in token may not trigger a Pages build on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
